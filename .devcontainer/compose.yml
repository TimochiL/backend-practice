# Dev environment: the dev container plus Postgres on a private compose network.
# VS Code runs this file on the host, so `..` below is the real repo folder.
#
# services.dev.image is the published dev image. CI reads its tag from here
# (.github/workflows/devcontainer-image.yml); bump it in the same commit as any
# change to .devcontainer/image/.
services:
  dev:
    image: ghcr.io/timochil/backend-practice-dev:2
    volumes:
      - ..:/workspaces/backend-practice:cached
    command: sleep infinity
    environment:
      DATABASE_URL: postgres://postgres@db:5432/bp
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: bp
      # Dev only: no password. The database is reachable only on this compose
      # network (no ports are published to the host) and holds throwaway data.
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/18/docker;
      # mount the parent, not the pre-18 .../data path.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bp"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
